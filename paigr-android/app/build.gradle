plugins {
    id 'com.android.application'
}

// Release signing comes from keystore.properties when it exists (kept next to the
// project so rebuilt versions install over the old one); otherwise the debug key.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.textrelay.texts'
    compileSdk 35
    buildToolsVersion '35.0.1'

    defaultConfig {
        applicationId 'com.textrelay.texts'
        minSdk 29
        targetSdk 35
        versionCode 14
        versionName '1.5.1'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true   // the version shown in Settings comes from here
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
