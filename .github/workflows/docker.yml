# Builds the inbox server's image and publishes it as ghcr.io/<owner>/paigr-server (latest on main, plus each tag).
name: Server image
on:
  push:
    branches: [main]
    paths: ["inbox/**", ".github/workflows/docker.yml"]
    tags: ["server-*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/paigr-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=server-(.*),group=1
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: inbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
