# Builds both apps (unsigned) and runs their unit tests. Paigr's app tests run against the inbox in inbox/, so Node is set up too.
name: Apps
on:
  push:
    paths: ["paigr-android/**", "paigr-relay-android/**", "inbox/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["paigr-android/**", "paigr-relay-android/**"]
  workflow_dispatch:
jobs:
  app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [paigr-relay-android, paigr-android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleRelease testReleaseUnitTest
        working-directory: ${{ matrix.dir }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.dir }}
          path: |
            ${{ matrix.dir }}/app/build/outputs/apk/release/*.apk
            ${{ matrix.dir }}/app/build/reports/tests/
            ${{ matrix.dir }}/app/build/screens/
          if-no-files-found: ignore
